{# Supabase Realtime çekirdeği — login'li HER sayfada yüklenir (base.html).
   Önceden yalnızca mesajlaşma sayfalarındaydı; aramalar da sadece orada
   çalıyordu. Artık akış/profil/her yerde telefon çalar (kullanıcı isteği).
   Mesajlaşmaya özgü scriptler messages/_realtime_init.html'de kalır. #}
<script>
    window.SUPABASE_URL = "{{ config.SUPABASE_URL }}";
    window.SUPABASE_KEY = "{{ config.SUPABASE_PUBLISHABLE_KEY }}";
    window.SB_ACCESS_TOKEN = "{{ session.access_token }}";
    window.ME_ID = "{{ me.id }}";
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// GEÇİCİ TANI YARDIMCISI (Supabase Support talebi) — imza doğrulamadan SADECE
// claim'leri okur, tüm tanı loglarında paylaşılan tek kaynak.
window.__decodeJwt = function (token) {
    try {
        var payload = token.split('.')[1];
        var base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
        var json = decodeURIComponent(
            atob(base64).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''),
        );
        return JSON.parse(json);
    } catch (e) {
        return { __decodeError: e.message };
    }
};
(function () {
    if (window.supabaseClient || !window.supabase) return;
    // auth kalıcılığı TAMAMEN kapalı: varsayılan persistSession, localStorage'da
    // haftalar önce kalmış bayat bir oturumu otomatik yükleyip bizim verdiğimiz
    // taze token'ı İÇERİDEN eziyordu — normal profilde CHANNEL_ERROR/401, gizli
    // sekmede (boş localStorage) sorunsuz (canlı test bulgusu, Brave). Oturumun
    // tek sahibi Flask; tarayıcı sadece setAuth ile verilen token'ı kullanır.
    window.supabaseClient = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_KEY,
        { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }
    );
    // GEÇİCİ TANI: bu client örneğine benzersiz bir kimlik damgalıyoruz —
    // "setAuth çağrılan client ile channel() çağrılan client AYNI mı"
    // sorusunu, tek bir global singleton olduğu iddiasını VARSAYMADAN,
    // GERÇEKTEN karşılaştırılabilir kılmak için (Supabase Support'un "wrong
    // client instance" hipotezi).
    window.supabaseClient.__instanceId = 'sc-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    console.log('[DIAG realtime] supabaseClient OLUŞTURULDU, instanceId=' + window.supabaseClient.__instanceId);
    // Token yenileme SADECE sunucuda yapılır (auth.refresh_session_tokens) —
    // tek kullanımlık refresh token iki taraf arasında tüketilmesin (geçmiş
    // 400 hatası). Realtime'ın ihtiyacı olan tek şey geçerli access token.
    (function () {
        var claims = window.__decodeJwt(window.SB_ACCESS_TOKEN);
        console.log('[DIAG realtime] İLK setAuth (gömülü token), instanceId=' + window.supabaseClient.__instanceId +
            ', sub=' + claims.sub + ', exp=' + claims.exp);
    })();
    window.supabaseClient.realtime.setAuth(window.SB_ACCESS_TOKEN);
    // Mesajlaşma dışı sayfalarda gömülü token bayat olabilir (render öncesi
    // yenilemeyi yalnızca mesajlaşma view'ları yapıyor) — yüklenir yüklenmez
    // sunucudan taze token çekilir; call.js global arama dinleyicisi kanala
    // abone olmadan önce bu promise'i bekler (bayat token'la subscribe
    // CHANNEL_ERROR üretebilir).
    // relogin işareti: sunucu, refresh token'ın KESİN reddedildiğini söylüyor
    // (süresi dolmuş/iptal/proje değişmiş) — oturum canlı özellikler için ölü,
    // yarı-çalışır bırakma: temiz çıkışa götür, kullanıcı yeniden giriş yapar.
    function handleTokenResponse(d) {
        if (d && d.relogin) { window.location.href = '/logout'; return; }
        if (d && d.access_token) {
            window.SB_ACCESS_TOKEN = d.access_token;
            var claims = window.__decodeJwt(d.access_token);
            console.log('[DIAG realtime] setAuth (taze /auth/realtime-token), instanceId=' +
                window.supabaseClient.__instanceId + ', sub=' + claims.sub + ', exp=' + claims.exp);
            window.supabaseClient.realtime.setAuth(d.access_token);
            console.log('[DIAG realtime] setAuth döndü, instanceId=' + window.supabaseClient.__instanceId);
        }
    }
    window.SB_TOKEN_READY = fetch('/auth/realtime-token')
        .then(function (r) { return r.json(); })
        .then(handleTokenResponse)
        .catch(function () { /* eldeki gömülü token'la devam */ });
    // Uzun süre açık kalan sekmede token bayatlar — 30 dakikada bir tazele
    setInterval(function () {
        fetch('/auth/realtime-token')
            .then(function (r) { return r.json(); })
            .then(handleTokenResponse)
            .catch(function () { /* bir sonraki turda tekrar denenir */ });
    }, 30 * 60 * 1000);

    // Bir kanal CHANNEL_ERROR/TIMED_OUT verdiğinde (call.js/chat.js/
    // liveBadges.js çağırır) buraya gelinir — normal 30dk'lık döngü SAAT
    // bazlı yeniliyor (bkz. /auth/realtime-token), bir JWT imza anahtarı
    // rotasyonu token'ı saat açısından hâlâ geçerliyken ANINDA geçersiz
    // kılabilir; force olmadan kullanıcı sekmeyi kapatıp yeniden açana
    // kadar aynı bozuk token'la sonsuza dek denenirdi (canlı bulgu).
    // setAuth() zaten hâlihazırda subscribe/retry aşamasındaki kanallara
    // taze token'ı iter (supabase-js), bu yüzden manuel resubscribe
    // GEREKMİYOR — sadece taze bir token almak yeterli.
    var _lastForceReauth = 0;
    var _forceReauthInFlight = null;
    window.forceRealtimeReauth = function () {
        var now = Date.now();
        if (_forceReauthInFlight) return _forceReauthInFlight;
        if (now - _lastForceReauth < 5000) return Promise.resolve();
        _lastForceReauth = now;
        _forceReauthInFlight = fetch('/auth/realtime-token?force=1')
            .then(function (r) { return r.json(); })
            .then(handleTokenResponse)
            .catch(function () { /* bir sonraki hata turunda tekrar denenir */ })
            .then(function () { _forceReauthInFlight = null; });
        return _forceReauthInFlight;
    };
})();
</script>
<script src="{{ url_for('static', filename='js/call.js') }}"></script>
<script src="{{ url_for('static', filename='js/liveBadges.js') }}"></script>
